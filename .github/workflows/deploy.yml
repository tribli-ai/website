name: Deploy to Vercel

on:
  push:
    branches: [ main, prod ]
  pull_request:
    branches: [ main, prod ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (if not static)
        if: github.ref != 'refs/heads/prod'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (if not static)
        if: github.ref != 'refs/heads/prod'
        run: npm ci

      - name: Run linting (if not static)
        if: github.ref != 'refs/heads/prod'
        run: npm run lint

      - name: Build application (if not static)
        if: github.ref != 'refs/heads/prod'
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Configure Git for Vercel
        run: |
          git config --local user.email "anoop@tribli.ai"
          git config --local user.name "Anoop Singh"

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        run: |
          export GIT_AUTHOR_EMAIL="anoop@tribli.ai"
          export GIT_AUTHOR_NAME="Anoop Singh"
          export GIT_COMMITTER_EMAIL="anoop@tribli.ai"
          export GIT_COMMITTER_NAME="Anoop Singh"
          vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod') && github.event_name == 'push'
        run: |
          export GIT_AUTHOR_EMAIL="anoop@tribli.ai"
          export GIT_AUTHOR_NAME="Anoop Singh"
          export GIT_COMMITTER_EMAIL="anoop@tribli.ai"
          export GIT_COMMITTER_NAME="Anoop Singh"
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes --force
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}